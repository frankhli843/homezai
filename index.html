<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/homezai-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homezai — AI Showings Management for Real Estate</title>
    <meta name="description" content="Homezai revolutionizes property showings for real estate professionals with intelligent scheduling, automated routing, and seamless integrations." />

    <!-- GitHub Pages SPA routing support (keeps clean /support, /pricing, /integrations URLs) -->
    <script type="text/javascript">
      ;(function (l) {
        if (l.search && l.search[1] === '/') {
          const decoded = l.search
            .slice(1)
            .split('&')
            .map((s) => s.replace(/~and~/g, '&'))
            .join('?')
          window.history.replaceState(null, null, l.pathname.replace(/\/$/, '') + decoded + l.hash)
        }
      })(window.location)
    </script>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VJ5C0CSR0B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // send_page_view disabled here — SPA route changes send page_view explicitly via analytics.js
      gtag('config', 'G-VJ5C0CSR0B', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
