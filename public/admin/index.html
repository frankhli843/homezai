<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow">
    <title>Homezai content editor</title>
    <link rel="icon" type="image/svg+xml" href="/homezai-favicon.svg" />
    <!--
      This page is public and inert on purpose. It holds no credential and grants
      nothing. The editor talks straight to api.github.com with the signed in
      publisher's own token, so GitHub is the thing that decides what may be read and
      written, not this markup and not anything React renders.

      The editor bundle is served from homezai.com rather than a third party CDN. A
      page that handles a GitHub token should not load its own code from a host we do
      not control, and pinning it here means the version is whatever package-lock.json
      says it is.
    -->
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      .cms-boot {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #64748B;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="cms-boot">The Homezai content editor needs JavaScript enabled.</div>
    </noscript>
    <div class="cms-boot" id="cms-boot">Loading the Homezai content editor...</div>
    <script src="/admin/sveltia-cms.js" type="module"></script>
    <script type="module">
      /*
       * Take the placeholder down the moment the editor paints something of its own.
       * The first version waited on a timer and counted body children, and against
       * production that left "Loading the Homezai content editor..." sitting above the
       * sign in screen, because the editor mounts its own root rather than replacing
       * the body. Watching for its root is the thing that is actually true.
       *
       * If it never appears, say so. A blank page tells a publisher nothing.
       */
      const boot = document.getElementById('cms-boot')

      const editorIsUp = () =>
        Boolean(document.querySelector('#app, .sveltia-cms, [class*="sveltia"]')) ||
        document.querySelectorAll('body > *').length > 3

      const remove = () => {
        if (boot && boot.isConnected) boot.remove()
      }

      const observer = new MutationObserver(() => {
        if (editorIsUp()) {
          remove()
          observer.disconnect()
        }
      })
      observer.observe(document.body, { childList: true, subtree: true })

      setTimeout(() => {
        observer.disconnect()
        if (editorIsUp()) {
          remove()
        } else if (boot && boot.isConnected) {
          boot.textContent =
            'The editor did not finish loading. Reload the page, and if it keeps happening tell Frank which browser you are using.'
        }
      }, 15000)
    </script>
  </body>
</html>
