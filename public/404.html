<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homezai</title>
  </head>
  <body>
    <!--
      GitHub Pages SPA routing support.
      When a user visits a deep link, GitHub Pages serves 404.html.
      This script redirects to /?/path, then index.html decodes it back to the route.
      Based on https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      ;(function () {
        var l = window.location
        var path = l.pathname
        if (path.startsWith('/')) path = path.slice(1)

        var redirect =
          l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          '/?/' +
          path.replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash

        l.replace(redirect)
      })()
    </script>
  </body>
</html>
