name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # Derived from the page data rather than a hand written list, so a logo
      # added later cannot silently escape the build check the way a fourth
      # entry would have escaped the original three line loop.
      - name: Assert every referenced partner logo is emitted into the build
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { integrationCategories } from "./src/integrationsData.js"
            const logos = integrationCategories
              .flatMap((c) => c.items)
              .filter((i) => i.logo)
              .map((i) => i.logo.replace(/^\//, ""))
            if (logos.length < 4) {
              console.error(`expected at least four referenced logos, found ${logos.length}`)
              process.exit(1)
            }
            console.log(logos.join("\n"))
          ' > /tmp/referenced-logos.txt
          while read -r rel; do
            [ -n "$rel" ] || continue
            test -s "dist/$rel" || { echo "missing or empty build asset: dist/$rel"; exit 1; }
            cmp -s "public/$rel" "dist/$rel" \
              || { echo "built asset differs from the committed source: $rel"; exit 1; }
            echo "ok dist/$rel ($(stat -c%s "dist/$rel") bytes)"
          done < /tmp/referenced-logos.txt
      # The dist backed test skips when dist/ is absent, so run the suite once
      # more now that a real build exists. Without this it would never execute
      # in CI and would read as a pass it never earned.
      - name: Re-run the suite against the built site
        run: npm test
      - name: Assert the deployed Homezai wordmark is the exact supplied artwork
        run: |
          set -euo pipefail
          f=dist/images/homezai-wordmark.png
          test -s "$f" || { echo "missing or empty build asset: $f"; exit 1; }
          echo "f1b4d81b591e7f166618bfad5663c990b1b45b9d9874fec81fda5d8c2e978bd0  $f" \
            | sha256sum --check --strict
          echo "ok $f ($(stat -c%s "$f") bytes)"
