name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Assert the supplied partner logos are emitted into the build
        run: |
          set -euo pipefail
          for f in \
            dist/images/integrations/coconut-coast-organization-of-realtors.png \
            dist/images/integrations/baldwin-county-association-of-realtors.png \
            dist/images/integrations/gulf-coast-mls-mobile-area-association-of-realtors.jpg
          do
            test -s "$f" || { echo "missing or empty build asset: $f"; exit 1; }
            echo "ok $f ($(stat -c%s "$f") bytes)"
          done
      - name: Assert the deployed Homezai wordmark is the exact supplied artwork
        run: |
          set -euo pipefail
          f=dist/images/homezai-wordmark.png
          test -s "$f" || { echo "missing or empty build asset: $f"; exit 1; }
          echo "f1b4d81b591e7f166618bfad5663c990b1b45b9d9874fec81fda5d8c2e978bd0  $f" \
            | sha256sum --check --strict
          echo "ok $f ($(stat -c%s "$f") bytes)"
